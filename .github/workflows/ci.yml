name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        run: deno cache --unstable-kv src/index.ts

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check --unstable-kv src/index.ts mod.ts
        continue-on-error: true  # engine:ready not yet in GameHookMap

      - name: Test
        run: deno task test --no-check
