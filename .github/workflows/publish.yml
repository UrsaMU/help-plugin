name: Publish to JSR

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for JSR OIDC publish

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test before publish
        run: deno task test --no-check

      - name: Publish to JSR
        run: deno publish
